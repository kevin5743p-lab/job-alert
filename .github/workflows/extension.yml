name: extension

# Deliberately not on a schedule — job-alert.yml owns the cron. This one reacts
# to the extension changing, and to an ext-v* tag when we want a downloadable
# build. The bot's own "chore: update state" commits carry [skip ci], so they do
# not drag this along every two hours.
on:
  push:
    branches: [main]
    tags: ['ext-v*']
  pull_request:
    paths: ['extension/**', 'test/**', 'scripts/pack-extension.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The extension ships as raw ES modules with no bundler, so a typo'd
      # import is not a build error — it is a blank page at 2am. This is the
      # cheapest place to catch it.
      - name: Imports resolve
        run: node test/check_imports.mjs extension

      - name: Unit tests
        run: |
          status=0
          for t in test/*.test.mjs; do
            echo "── $t"
            node "$t" || status=1
          done
          exit $status

  release:
    # Only for tags, and only once the tests above are green.
    if: startsWith(github.ref, 'refs/tags/ext-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        id: pack
        run: |
          chmod +x scripts/pack-extension.sh
          echo "path=$(./scripts/pack-extension.sh)" >> "$GITHUB_OUTPUT"

      - name: Attach it to a release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.path }}
          generate_release_notes: true
