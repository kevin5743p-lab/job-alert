<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My applications — JobCopilot</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 28px 24px 60px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1f2328; background: #f6f8fa;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #57606a; font-size: 13px; margin: 0 0 20px; }

    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat {
      background: #fff; border: 1px solid #d8dee4; border-radius: 8px;
      padding: 8px 14px; font-size: 13px;
    }
    .stat b { font-size: 18px; display: block; }

    table { width: 100%; border-collapse: collapse; background: #fff;
            border: 1px solid #d8dee4; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eaeef2;
             vertical-align: top; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
         color: #6e7781; background: #f6f8fa; }
    tr:last-child td { border-bottom: none; }
    .job { font-weight: 600; }
    .co { color: #57606a; font-size: 13px; }
    .muted { color: #8b949e; font-size: 12px; }
    a { color: #4f46e5; text-decoration: none; }
    a:hover { text-decoration: underline; }

    select { padding: 4px 6px; border: 1px solid #d0d7de; border-radius: 6px;
             font: inherit; font-size: 12px; background: #fff; }
    button {
      padding: 4px 10px; font-size: 12px; cursor: pointer; border: 1px solid #d0d7de;
      border-radius: 6px; background: #f6f8fa; color: #1f2328; margin-right: 4px;
    }
    button:hover { background: #eaeef2; }
    button.danger:hover { background: #ffebe9; border-color: #ff8182; }

    .empty { background: #fff; border: 1px dashed #d0d7de; border-radius: 8px;
             padding: 36px; text-align: center; color: #57606a; }
    .msg { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    .msg.err { background: #ffebe9; color: #82071e; }
    .hidden { display: none; }

    button.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; font-weight: 600; }
    button.primary:hover { background: #4338ca; }
    button:disabled { opacity: .6; cursor: default; }

    .scan {
      background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3;
      border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px;
    }
    .scan.err { background: #ffebe9; border-color: #ffc1bc; color: #82071e; }
    .scan .sub { color: #6366f1; font-size: 12px; margin-top: 3px; }

    .stat[data-filter] { cursor: pointer; user-select: none; }
    .stat[data-filter]:hover { border-color: #a5b4fc; }
    .stat.on { border-color: #4f46e5; background: #eef2ff; }

    .why { color: #6e7781; font-size: 12px; margin-top: 2px; }
    .score { font-weight: 600; font-size: 14px; }
    .s-hi { color: #1a7f37; }
    .s-mid { color: #9a6700; }
    .s-lo { color: #8b949e; }
    .btnlink {
      display: inline-block; padding: 4px 10px; font-size: 12px; margin-right: 4px;
      border: 1px solid #4f46e5; border-radius: 6px; background: #4f46e5; color: #fff;
    }
    .btnlink:hover { background: #4338ca; text-decoration: none; }

    .st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
    .st-new { background: #eef2ff; color: #4338ca; }
    .st-dismissed { background: #eaeef2; color: #8b949e; }
    .st-saved { background: #eaeef2; color: #57606a; }
    .st-tailored { background: #eef2ff; color: #4338ca; }
    .st-applied { background: #fff8c5; color: #7d4e00; }
    .st-interview { background: #dbf4ff; color: #0550ae; }
    .st-offer { background: #e6f4ea; color: #1a7f37; }
    .st-rejected { background: #ffebe9; color: #82071e; }

    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      .stat, table, .empty { background: #161b22; border-color: #30363d; }
      .scan { background: #1c1b2e; border-color: #3730a3; color: #c7d2fe; }
      .scan.err { background: #2d1214; border-color: #6b2226; color: #ffa198; }
      .stat.on { background: #1c1b2e; }
      th { background: #0d1117; color: #8b949e; }
      th, td { border-color: #21262d; }
      .sub, .co, .muted { color: #8b949e; }
      select, button { background: #21262d; color: #e6edf3; border-color: #30363d; }
      button:hover { background: #30363d; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>My applications</h1>
        <p class="sub" id="who">Loading…</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="find" class="primary">🔍 Find jobs</button>
        <button id="refresh">Refresh</button>
      </div>
    </header>
    <div id="scan" class="scan hidden"></div>

    <div id="message" class="msg hidden"></div>
    <div class="stats" id="stats"></div>
    <div id="content"></div>
  </div>

  <script src="print_doc.js"></script>
  <script src="cover_templates.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
