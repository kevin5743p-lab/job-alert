<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My applications — JobCopilot</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Layout and components only — every colour, radius and duration comes
       from theme.css. Class and id names are untouched: the JS queries them. */
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px 24px 72px;
      font: 14px/1.6 var(--font);
      color: var(--text); background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    /* A wash of accent behind the header, so the page has a horizon rather
       than starting flat at the top. */
    body::before {
      content: ""; position: fixed; inset: 0 0 auto 0; height: 320px; z-index: -1;
      background: radial-gradient(90% 100% at 50% 0%,
                  color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%);
      pointer-events: none;
    }
    /* Wider than the other surfaces on purpose: this one holds a seven-column
       table, and at 1040px the job title was squeezed into a 90px ribbon that
       wrapped every posting over six lines. */
    .wrap { max-width: 1320px; margin: 0 auto; }

    header { display: flex; align-items: flex-start; justify-content: space-between;
             gap: 16px; margin-bottom: 22px; animation: jc-rise var(--dur-3) var(--ease-out) both; }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.02em; }
    .sub { color: var(--text-2); font-size: 13px; margin: 0; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ── Controls ──────────────────────────────────────────────────────── */
    button, .btnlink {
      font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
      padding: 8px 16px; border-radius: var(--r-pill);
      border: 1px solid var(--border-hi); background: var(--surface-2);
      color: var(--text); text-decoration: none; display: inline-block;
      transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease),
                  transform var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
    }
    button:hover, .btnlink:hover { background: var(--surface-3); border-color: var(--accent-line); }
    button:active { transform: translateY(1px); }
    button:focus-visible, .btnlink:focus-visible,
    select:focus-visible, input:focus-visible, th:focus-visible {
      outline: none; box-shadow: var(--ring); border-color: var(--accent);
    }
    button:disabled { opacity: .55; cursor: default; transform: none; }
    button.primary, .btnlink {
      background: var(--accent); border-color: var(--accent); color: var(--on-accent);
      font-weight: 600;
    }
    button.primary:hover, .btnlink:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
    button.primary:disabled { background: var(--accent); }
    button.danger:hover { background: var(--bad-dim); border-color: var(--bad-line); color: var(--bad); }

    select, input[type="search"] {
      font: inherit; font-size: 13px; padding: 6px 9px; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border-hi);
      border-radius: var(--r-sm);
      transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
    }

    /* ── Scan + notices ────────────────────────────────────────────────── */
    .scan, .msg {
      border-radius: var(--r); padding: 12px 14px; font-size: 13px;
      margin-bottom: 16px; border: 1px solid var(--accent-line);
      background: var(--accent-dim); color: var(--text);
      animation: jc-rise var(--dur-2) var(--ease-out) both;
    }
    /* A band of light crossing the notice while a scan runs — the one piece of
       motion that repeats, because a scan takes minutes and stillness reads as
       a hang. It stops the moment the notice turns into an error. */
    .scan { position: relative; overflow: hidden; }
    .scan::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(100deg, transparent 30%,
                  color-mix(in srgb, var(--accent) 18%, transparent) 50%, transparent 70%);
      background-size: 230% 100%;
      animation: jc-sweep 3.6s ease-in-out infinite;
    }
    .scan.err::after { display: none; }
    .scan.err, .msg.err {
      background: var(--bad-dim); border-color: var(--bad-line); color: var(--bad);
    }
    .scan .sub { color: var(--text-2); font-size: 12px; margin-top: 4px; }
    .scan.err .sub { color: var(--bad); opacity: .85; }
    .hidden { display: none !important; }

    /* ── Stat chips ────────────────────────────────────────────────────── */
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 10px 16px; font-size: 12px;
      color: var(--text-2); min-width: 76px; position: relative;
      transition: border-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease),
                  background var(--dur-1) var(--ease);
      animation: jc-rise var(--dur-2) var(--ease-out) both;
    }
    .stat b { font-size: 22px; display: block; color: var(--text); font-weight: 650;
              letter-spacing: -.02em; line-height: 1.25; }
    .stat[data-filter] { cursor: pointer; user-select: none; }
    .stat[data-filter]:hover { border-color: var(--accent-line); transform: translateY(-2px); }
    .stat.on { border-color: var(--accent); background: var(--accent-dim); }
    .stat.on b { color: var(--accent); }

    /* ── Filters ───────────────────────────────────────────────────────── */
    .filters {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px;
      animation: jc-rise var(--dur-2) var(--ease-out) both;
    }
    .filters label { display: flex; align-items: center; gap: 6px;
                     font-size: 12px; color: var(--text-2); }
    /* Capped: left to grow freely it absorbs every spare pixel and pushes the
       count onto a line of its own even in a wide window. */
    .filters input[type="search"] { flex: 1 1 200px; min-width: 150px; max-width: 320px; }
    .filters.on { border-color: var(--accent); box-shadow: var(--ring); }
    #f-count { margin-left: auto; white-space: nowrap; color: var(--text-3); font-size: 12px; }

    /* ── Table ─────────────────────────────────────────────────────────── */
    /* Eight columns do not fit a narrow window, and the page scrolling sideways
       drags the header and filters off screen with it. Confine it here. */
    #content { overflow-x: auto; }
    /* The frame lives on the scroll container, not on the table.
       It used to be on the table itself, via `overflow: hidden` for the rounded
       corners — and an `overflow: hidden` ancestor is exactly what stops
       `position: sticky` from working, so the pinned job column below silently
       scrolled away with everything else. The class is only applied when there
       really is a table, so the empty state doesn't get a second border. */
    #content.boxed {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); box-shadow: var(--shadow-1);
    }
    table { width: 100%; min-width: 1080px;
            border-collapse: separate; border-spacing: 0; }
    th, td { text-align: left; padding: 10px 13px; vertical-align: top;
             border-bottom: 1px solid var(--border); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
         font-weight: 600; color: var(--text-3); background: var(--surface-2);
         position: sticky; top: 0; z-index: 2; }
    th.sortable { cursor: pointer; user-select: none; white-space: nowrap;
                  transition: color var(--dur-1) var(--ease); }
    th.sortable:hover { color: var(--accent); }
    th.sorted { color: var(--accent); }
    tbody tr { transition: background var(--dur-1) var(--ease); }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr:last-child td { border-bottom: none; }

    /* The job column stays put while the rest scrolls sideways.
       Without this the first thing to leave a narrow window is the only column
       that identifies the row, and you are left reading "78 · found · LinkedIn"
       with no idea which job that is.

       The min-width is not decoration. Table auto-layout hands the spare width
       to whichever column demands it, and the actions cell — five buttons that
       must not wrap mid-word — demands a lot; left alone it starves the one
       column that says what the row is. */
    th:first-child, td:first-child {
      position: sticky; left: 0; z-index: 1;
      min-width: 290px; width: 34%;
      background: var(--surface); border-right: 1px solid var(--border);
    }
    th:first-child { z-index: 3; background: var(--surface-2); }
    tbody tr:hover td:first-child { background: var(--surface-2); }

    /* One fade for the whole body rather than a stagger per row. A staggered
       entrance is charming at twelve rows and absurd at a hundred — and the
       per-row transform it needs would break the sticky column above. */
    tbody { animation: jc-fade var(--dur-2) var(--ease) both; }

    .job { font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
    .co { color: var(--text-2); font-size: 13px; margin-top: 2px; }
    /* Clamped, because this is the single reason the old table couldn't hold a
       long list: a three-line explanation per row made every row ~200px tall,
       so a hundred jobs was twenty thousand pixels of scrolling. Two lines is
       enough to judge relevance; the rest is one click away. */
    .why { color: var(--text-3); font-size: 12px; margin-top: 5px;
           padding-left: 9px; border-left: 2px solid var(--border-hi); }
    /* Scoped to the table: the same class is used in the apply panel, where
       there is only ever one line and nothing to expand. */
    td .why {
      max-width: 460px; cursor: pointer;
      display: -webkit-box; -webkit-box-orient: vertical;
      -webkit-line-clamp: 2; overflow: hidden;
    }
    td .why.open { -webkit-line-clamp: unset; display: block; }
    td .why:hover { color: var(--text-2); }
    .muted { color: var(--text-3); font-size: 12px; }

    /* Row actions. Five buttons at full size is a 340px column, which is a
       third of the table spent on controls; small and wrapped to two lines,
       it is half that and reads as a cluster belonging to the row. */
    td.acts { white-space: normal; }
    td.acts > * {
      margin: 0 4px 4px 0; padding: 5px 11px; font-size: 12px;
      white-space: nowrap; vertical-align: middle;
    }

    /* ── Pager ─────────────────────────────────────────────────────────── */
    .pager {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-top: 14px; font-size: 12px; color: var(--text-2);
    }
    .pager .spacer { flex: 1 1 auto; }
    .pager button { padding: 6px 12px; font-size: 12px; }
    .pager select { font-size: 12px; padding: 5px 8px; }
    .pager b { color: var(--text); font-weight: 600; }
    a { color: var(--accent); text-decoration: none;
        transition: color var(--dur-1) var(--ease); }
    a:hover { color: var(--accent-hi); text-decoration: underline; }

    /* ── Fit score ─────────────────────────────────────────────────────── */
    .score {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 38px; padding: 3px 8px; border-radius: var(--r-sm);
      font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
      border: 1px solid transparent; animation: jc-pop var(--dur-3) var(--ease-out) both;
    }
    .s-hi  { color: var(--good); background: var(--good-dim); border-color: var(--good-line); }
    .s-mid { color: var(--warn); background: var(--warn-dim); border-color: var(--warn-line); }
    .s-lo  { color: var(--text-3); background: var(--surface-2); border-color: var(--border); }

    /* ── Status pills ──────────────────────────────────────────────────── */
    .st { display: inline-block; padding: 2px 10px; border-radius: var(--r-pill);
          font-size: 11px; font-weight: 600; letter-spacing: .01em;
          border: 1px solid transparent; }
    .st-new       { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-line); }
    .st-tailored  { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-line); }
    .st-saved     { background: var(--surface-3); color: var(--text-2); border-color: var(--border-hi); }
    .st-dismissed { background: var(--surface-2); color: var(--text-3); border-color: var(--border); }
    .st-applied   { background: var(--warn-dim); color: var(--warn); border-color: var(--warn-line); }
    .st-interview { background: var(--info-dim); color: var(--info); border-color: var(--info-line); }
    .st-offer     { background: var(--good-dim); color: var(--good); border-color: var(--good-line); }
    .st-rejected  { background: var(--bad-dim); color: var(--bad); border-color: var(--bad-line); }
    td select { margin-top: 6px; font-size: 12px; padding: 4px 7px; }

    .empty {
      background: var(--surface); border: 1px dashed var(--border-hi);
      border-radius: var(--r-lg); padding: 52px 24px; text-align: center;
      color: var(--text-2); animation: jc-fade var(--dur-3) var(--ease) both;
    }

    /* ── Auto-apply ─────────────────────────────────────────────────────── */

    .apply-panel {
      border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 14px 16px; margin: 0 0 16px;
      background: var(--surface-2, rgba(127,127,127,.05));
      animation: jc-fade var(--dur-3) var(--ease) both;
    }
    /* The live queue breathes slowly while work is happening — the one calm,
       ambient signal that something is being applied to right now. */
    #applyPanel:not([hidden]) {
      animation: jc-fade var(--dur-3) var(--ease) both, jc-breathe 4s ease-in-out 420ms infinite;
    }
    .apply-panel h3 {
      margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-2);
    }
    .apply-panel h3 + ul + h3 { margin-top: 14px; }
    ul.queue { margin: 0; padding: 0; list-style: none; }
    ul.queue li {
      padding: 6px 0; font-size: 13px;
      border-bottom: 1px solid var(--line);
    }
    ul.queue li:last-child { border-bottom: none; }
    ul.queue .muted { margin-left: 6px; }
    .apply-panel p.muted { margin: 8px 0 0; }

    /* The hand-off block: what to do about a run that stopped.
       Set apart from the reason above it, because the reason is a record of
       what happened and this is a set of instructions — reading as one
       paragraph is how "cdp: CSS is not defined" ended up looking like a
       question the user was supposed to answer. */
    .todo {
      margin: 8px 0 4px; padding: 10px 12px;
      border-left: 2px solid var(--warn, #d97706);
      background: rgba(217,119,6,.07);
      border-radius: 0 6px 6px 0; font-size: 13px;
    }
    /* Our own fault, not theirs. Different colour so the distinction is
       visible before a word is read. */
    .todo.ours {
      border-left-color: var(--text-3, #8b8b8b);
      background: rgba(127,127,127,.08);
    }
    .todo b { display: block; margin-bottom: 6px; }
    .todo ol { margin: 0; padding-left: 18px; color: var(--text-2); }
    .todo ol li { padding: 2px 0; border: none; }
    .todo-part { margin-top: 8px; }
    .todo-part b { font-weight: 600; }

    /* The all-sites grant. Deliberately the loudest thing on the page while it
       is missing — without it auto-apply only works on the job boards, which is
       a fraction of what the user thinks they are getting. */
    .grant-banner {
      margin: 0 0 18px; padding: 14px 16px;
      border: 1px solid var(--accent, #4f46e5);
      background: rgba(79,70,229,.08);
      border-radius: 10px; font-size: 13px;
      display: flex; gap: 14px; align-items: center; justify-content: space-between;
      flex-wrap: wrap;
    }
    .grant-banner b { display: block; margin-bottom: 3px; font-size: 14px; }
    .grant-banner .muted { display: block; }
    .grant-banner button { white-space: nowrap; }
    .todo-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* The per-row state chip. Colour carries the same meaning as the status
       column, so a scan down the table reads consistently. */
    .apply-state {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
      background: rgba(127,127,127,.12); color: var(--text-2);
    }
    .apply-state.good { background: rgba(22,163,74,.14); color: var(--good, #16a34a); }
    .apply-state.warn { background: rgba(217,119,6,.14); color: var(--warn, #d97706); }
    .apply-state.busy {
      background: rgba(79,70,229,.14); color: var(--accent, #4f46e5);
      animation: jc-pulse 1.4s ease-in-out infinite;
    }
    @keyframes jc-pulse { 50% { opacity: .55; } }

    @media (prefers-reduced-motion: reduce) {
      .apply-state.busy { animation: none; }
    }

    @media (max-width: 720px) {
      body { padding: 20px 14px 56px; }
      header { flex-direction: column; }
      th, td { padding: 11px 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>My applications</h1>
        <p class="sub" id="who">Loading…</p>
      </div>
      <div class="toolbar">
        <button id="find" class="primary">Find jobs for me</button>
        <button id="applyAll" title="Queue every strong match that's already tailored">Apply to all strong</button>
        <button id="filters-toggle">Filters</button>
        <button id="refresh">Refresh</button>
        <button id="settings" title="CV, documents, keys and how applying behaves">⚙ Settings</button>
      </div>
    </header>
    <!-- Standing offer of the one grant that decides whether auto-apply works
         on anything except the job boards. Hidden the moment it is given, and
         placed above everything because a user who grants it here never meets
         the mid-run failure it prevents. -->
    <div id="grantBanner" class="grant-banner" hidden></div>
    <div id="scan" class="scan hidden"></div>
    <div id="stale" class="scan hidden"></div>

    <!-- Live queue and per-site health. Hidden until there is something to
         say, so a quiet dashboard stays quiet. -->
    <div id="applyPanel" class="apply-panel" hidden></div>
    <!-- A running log of what the router is doing. Without this, anything that
         stops the engine before it starts (no API key, a quarantined domain)
         is completely invisible. -->
    <div id="applyActivity" class="apply-panel" hidden></div>

    <div id="message" class="msg hidden"></div>

    <div id="filters" class="filters hidden">
      <input id="f-search" type="search" placeholder="Search title, company or location…" />
      <label>Fit
        <select id="f-fit">
          <option value="">any</option>
          <option value="85">85+ outstanding</option>
          <option value="70">70+ strong</option>
          <option value="50">50+ worth a look</option>
          <option value="scored">scored at all</option>
          <option value="unscored">not scored</option>
        </select>
      </label>
      <label>Released
        <select id="f-released">
          <option value="">any</option>
          <option value="1">last 24 hours</option>
          <option value="7">last 7 days</option>
          <option value="14">last 14 days</option>
          <option value="30">last 30 days</option>
          <option value="unknown">date unknown</option>
        </select>
      </label>
      <label>Source <select id="f-source"><option value="">any</option></select></label>
      <button id="f-clear">Clear</button>
      <span id="f-count" class="sub"></span>
    </div>

    <div class="stats" id="stats"></div>
    <div id="content"></div>
    <div id="pager" class="pager hidden"></div>
  </div>

  <script src="print_doc.js"></script>
  <script src="cover_templates.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
